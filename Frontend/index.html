<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Quản lý giải đấu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="topbar">
  <button class="icon-btn menu-btn" data-act="toggleMenu" aria-label="Mở menu"><i class="fa-solid fa-bars"></i></button>
  <div class="brand" id="brand"></div>
  <div class="tour-picker" id="tourPicker"></div>
  <div class="top-meta" id="topMeta"></div>
  <div class="top-actions">
    <button class="btn b-ghost" data-act="openTV"><i class="fa-solid fa-tv"></i><span>Xem giao diện TV</span></button>
    <button class="btn b-ghost" data-act="go" data-view="export"><i class="fa-solid fa-download"></i><span>Xuất dữ liệu</span></button>
    <div class="admin" id="adminBox"></div>
  </div>
</header>

<nav class="sidebar" id="sidebar"></nav>
<div class="scrim" data-act="toggleMenu"></div>

<main class="main" id="view"></main>

<div class="modal-root" id="modalRoot"></div>
<div class="toasts" id="toasts"></div>
<div class="tv" id="tv" hidden></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="js/logic.js"></script>
<script src="js/public.js"></script>
<script src="js/app.js"></script>
</body>
</html>
